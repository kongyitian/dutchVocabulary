# Kafka Integration Test Configuration
spring.application.name=dutch-vocabulary-api-kafka-test

# H2 Database for simplicity
spring.datasource.url=jdbc:h2:mem:kafkatestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Initialize test data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
app.jwt.secret=TestSecretKeyForJWTTokenGeneration12345678901234567890123456
app.jwt.expiration=86400000

# Kafka Configuration - will be overridden by @DynamicPropertySource
spring.kafka.enabled=true
spring.kafka.listener.missing-topics-fatal=false

# Logging
logging.level.com.dutchvocabulary=INFO
logging.level.org.apache.kafka=WARN

