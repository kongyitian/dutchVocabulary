# PostgreSQL Testcontainer Test Configuration
spring.application.name=dutch-vocabulary-api-postgres-test

# PostgreSQL settings - will be overridden by @DynamicPropertySource
# These are just defaults

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Initialize test data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
app.jwt.secret=TestSecretKeyForJWTTokenGeneration12345678901234567890123456
app.jwt.expiration=86400000

# Disable Kafka
spring.kafka.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Logging
logging.level.com.dutchvocabulary=DEBUG
logging.level.org.testcontainers=INFO

